[package]
name = "bvg-display"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version ="0.4", features = ["serde"] }
iced = { version = "0.14", features = ["tokio", "image"] }
rapidhash = "4.5"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.54"
toml = "0.9"
