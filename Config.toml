# BVG stops to display, by their BVG stop id.
bvg_stops = ["900040101"]

# Number of departures to be fetched each call
max_api_results = 10

# Show departures for how many minutes? 
max_departure_time_minutes = 30

# Directory containing the app's assets (fonts/, images/).
assets_dir = "assets"

# Whether the app should start in fullscreen mode.
fullscreen = true 

show_arriving_trips_only_once = true

# Filter out sub-stations returned by the API for big stations.
filter_substations = true

# Which UI to display: "retro" or "modern".
ui = "retro"

[retro_ui]
# Name of the font (loaded from assets_dir/fonts) used to render departures.
font = "Advanced Dot Digital-7" 
font_size = 20
max_display_rows = 10
# Reduce the font of the canceled trip message
reduce_canceled_text = false
blink_speed_millis = 700

[modern_ui]
# Name of the font (loaded from assets_dir/fonts) used to render departures.
font = "Fira Sans Black"
font_size = 24
max_display_rows = 10
