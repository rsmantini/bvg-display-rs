# BVG stops to display, by their BVG stop id.
bvg_stops = ["900040101"]

# Number of departures to be fetched each call
max_api_results = 10

# Directory containing the app's assets (fonts/, images/).
assets_dir = "assets"

# Whether the app should start in fullscreen mode.
fullscreen = true 

[retro_ui]
# Name of the font (loaded from assets_dir/fonts) used to render departures.
font = "Advanced Dot Digital-7" 
font_size = 20
max_display_rows = 10
